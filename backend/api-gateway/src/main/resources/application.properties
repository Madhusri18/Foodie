# ===============================
# Server Configuration
# ===============================

server.port=8080


# ===============================
# API Gateway Routes
# ===============================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**


spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**


spring.cloud.gateway.server.webflux.routes[2].id=restaurant-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/restaurants/**


spring.cloud.gateway.server.webflux.routes[3].id=food-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/foods/**


spring.cloud.gateway.server.webflux.routes[4].id=cart-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/cart/**


spring.cloud.gateway.server.webflux.routes[5].id=order-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/orders/**


spring.cloud.gateway.server.webflux.routes[6].id=delivery-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/deliveries/**


# ===============================
# Actuator
# ===============================

management.endpoints.web.exposure.include=health,info